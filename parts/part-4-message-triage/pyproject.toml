[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roboost-message-triage"
version = "0.1.0"
description = "Budget-guarded customer-message triage pipeline"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1,<2"]

[project.optional-dependencies]
gemini = ["google-genai>=1.75,<2"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
triage = "message_triage.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
